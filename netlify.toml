# Netlify builds this Next.js app with its OpenNext adapter, which is applied automatically
# once Next.js is detected during the build. Pinning the build here overrides any stale
# dashboard settings (e.g. from before the app moved to the repository root).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9+.
  NODE_VERSION = "22"

# The server reads branch data from the GitHub API. Set GITHUB_TOKEN in
# Site configuration → Environment variables; without it GitHub's anonymous limit
# (60 requests/hour, shared by Netlify's servers) is exhausted almost immediately.

# Netlify serves this Next.js app through its Next.js runtime. It's declared explicitly because
# Netlify only adds it automatically when it detects Next.js as the site is created, and this repo
# had no app at its root back then. Without it the raw .next folder is published and every page 404s.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9+.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The server reads branch data from the GitHub API. Set GITHUB_TOKEN in
# Site configuration → Environment variables; without it GitHub's anonymous limit
# (60 requests/hour, shared by Netlify's servers) is exhausted almost immediately.
